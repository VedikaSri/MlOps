
name: Iris ML API - CI Pipeline - CSE

# Define when GitHub should run this workflow
on: #event 
  # Run CI whenever code is pushed to main branch
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Permissions are restricted to read repository content
permissions:
  contents: read

# Define jobs that make up the pipeline
jobs:
  test-and-build:
    # GitHub provides a fresh Ubuntu virtual environment for this job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository content to the runner
      #without this the runner would not have the req project files
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install Python on the runner
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Step 3: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build Docker image
      - name: Build Docker Image
        run: docker build -t iris-ml-api:${{ github.sha }} #sha- crates id on every github commit, #{{}}- used for version
